# Compilation du firmware ESP32-P4 à chaque modification (image Docker officielle ESP-IDF v6.1).
name: Firmware ESP32-P4

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  compilation:
    name: Compilation (ESP-IDF v6.1, esp32p4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le firmware
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32p4
          path: firmware

      - name: Publier les binaires
        uses: actions/upload-artifact@v4
        with:
          name: suivi_nid-esp32p4
          path: |
            firmware/build/suivi_nid.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
            firmware/dependencies.lock
          if-no-files-found: error
