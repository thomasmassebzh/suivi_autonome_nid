# Compilation du firmware ESP32-P4 et du banc d'essai à chaque modification
# (image Docker officielle ESP-IDF v6.1). Le banc d'essai compile aussi les
# composants du firmware : il est recompilé quand ceux-ci changent.
name: Firmware ESP32-P4

on:
  push:
    paths:
      - "firmware/**"
      - "banc_essai/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "banc_essai/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  compilation:
    name: Compilation ${{ matrix.projet }} (ESP-IDF v6.1, esp32p4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - projet: firmware
            binaire: suivi_nid
            artefact: suivi_nid-esp32p4
          - projet: banc_essai
            binaire: banc_essai
            artefact: banc_essai-esp32p4
    steps:
      - uses: actions/checkout@v4

      - name: Compiler ${{ matrix.projet }}
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32p4
          path: ${{ matrix.projet }}

      - name: Publier les binaires
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: |
            ${{ matrix.projet }}/build/${{ matrix.binaire }}.bin
            ${{ matrix.projet }}/build/bootloader/bootloader.bin
            ${{ matrix.projet }}/build/partition_table/partition-table.bin
            ${{ matrix.projet }}/build/flash_args
            ${{ matrix.projet }}/dependencies.lock
          if-no-files-found: error
